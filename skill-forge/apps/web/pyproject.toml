[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-forge-web"
version = "0.1.0"
description = "Streamlit frontend for Skill Forge"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.47.0",
  "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
